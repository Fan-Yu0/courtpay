[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courtpay"
version = "0.1.0"
description = "x402 purchases with an Internet Court jury behind them"
requires-python = ">=3.10"
dependencies = ["eth-account>=0.13", "genlayer-py>=0.16"]

[tool.setuptools]
packages = ["courtpay"]
